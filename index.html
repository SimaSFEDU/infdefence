<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>∞ Оборона</title>
<style>
:root{--bg:#0a0a0a;--fg:#e8e8e8;--dim:#8d8d8d;--line:#232323;--acc:#ff5a36}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:max(env(safe-area-inset-top),var(--sat,0px)) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:10px;padding:0 8px 0 12px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
#hud .s{display:flex;gap:4px;align-items:center}
#hud .sp{flex:1}
#hud button{padding:6px 10px;font-size:13px;border-radius:8px}
#field{flex:1;position:relative;min-height:0}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#panel{flex:0 0 232px;height:232px;border-top:1px solid var(--line);padding:9px 10px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
#panel::-webkit-scrollbar{display:none}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid #3a3a3a;border-radius:10px;padding:10px 12px;cursor:pointer}
button:active{background:#1c1c1c}
button:disabled{opacity:.33}
.acc{border-color:var(--acc)!important;color:var(--acc)!important}
.on{background:#1d1d1d}
.dim{color:var(--dim)}
.small{font-size:11px}
.cards{display:grid;grid-template-rows:1fr 1fr;grid-auto-flow:column;grid-auto-columns:150px;gap:6px;overflow-x:auto;height:100%;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cards::-webkit-scrollbar{display:none}
.card{border:1px solid #333;border-radius:10px;padding:5px 7px;display:flex;flex-direction:row;align-items:center;gap:7px;text-align:left;min-width:0;overflow:hidden}
.card .cc{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.bpanel{display:flex;flex-direction:column;height:100%}
.bpanel .cards{flex:1;min-height:0;height:auto}
.terln{font-size:11px;color:var(--acc);margin:-2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card canvas{width:24px;height:24px;flex:0 0 24px}
.card .nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ds{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cs{font-size:11.5px}
.card.off{opacity:.35}
.row{display:flex;gap:8px;align-items:center}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.g6 button{padding:7px 1px 6px;font-size:12px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
.g6 button i{font-style:normal;font-size:10px;color:#9a9a9a}
.g6 button b{font-weight:600;font-size:12px}
.g6 button.danger b{color:#ccc}
.gch{display:grid;gap:6px}
.gch button{padding:7px 5px;font-size:11px;line-height:1.3;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:96px}
.gch b{font-size:12px;font-weight:600}
.gch span{color:#b4b4b4;font-size:11px}
.tp-head{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.tp-head canvas{width:26px;height:26px}
.tp-head .t{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-head button{min-width:40px;height:36px;padding:0 10px;font-size:14px}
.stats{font-size:11.5px;color:#b0b0b0;margin-bottom:4px;line-height:1.35;max-height:2.75em;overflow:hidden}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.84);display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
#ov.on{display:flex}
.box{background:#0e0e0e;border:1px solid #333;border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.box.full{height:92vh;max-height:none;display:flex;flex-direction:column;padding:12px;overflow:hidden;max-width:640px}
.box h1{font-size:26px;margin:0 0 4px;font-weight:600;letter-spacing:1px}
.box h2{font-size:18px;margin:0 0 10px;font-weight:600}
.box h3{font-size:12px;margin:16px 0 6px;color:var(--dim);font-weight:400;text-transform:uppercase;letter-spacing:1px}
.box p{font-size:13px;line-height:1.5;color:#bbb;margin:6px 0}
.col{display:flex;flex-direction:column;gap:8px}
.perk{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px}
.perk b{font-size:15px;font-weight:600}
.perk span{font-size:12px;color:#aaa}
.perk i{font-style:normal;font-size:11px;color:var(--dim)}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1d1d1d}
.mrow .i{flex:1;min-width:0}
.mrow .i b{font-size:13px;font-weight:600;display:block}
.mrow .i span{font-size:11px;color:var(--dim);display:block;line-height:1.45}
.mrow button{padding:8px 10px;font-size:12px;min-width:74px}
.mrow canvas{width:28px;height:28px;flex:0 0 28px}
.tog{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;padding:10px 12px;font-size:12px;gap:8px}
.tog b{font-weight:600;font-size:13px}
.tog i{font-style:normal;color:var(--dim);font-size:11px}
.rel{width:100%;text-align:left;padding:10px 12px;font-size:12px;line-height:1.45}
.rel b{font-size:13px;font-weight:600}
.r1{color:#9fb4ff}.r2{color:#ffd36b}.r3{color:var(--acc)}.r4{color:#7fe08a}
#abar button{width:42px;height:42px;opacity:.9;border-radius:50%;padding:0;font-size:10px;background:rgba(10,10,10,.88);line-height:1.15;white-space:pre}
#abar button.rdy{border-color:var(--acc);color:var(--acc)}
.tabs,.chips{display:flex;gap:6px;margin:0 -18px 8px;padding:6px 18px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;position:sticky;top:-18px;background:#0e0e0e;z-index:2}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tabs button,.chips button{padding:7px 12px;font-size:12px;border-radius:18px;white-space:nowrap;flex:0 0 auto}
.pchips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:5px}
.pchips::-webkit-scrollbar{display:none}
.pchips button{padding:4px 9px;font-size:11px;border-radius:14px;white-space:nowrap;flex:1 0 auto}
.xclose{position:sticky;top:-6px;float:right;width:40px;height:40px;padding:0;margin:-8px -8px 0 8px;font-size:16px;background:#0e0e0e;z-index:3;border-radius:50%}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tgrid .tog{padding:8px 10px;min-height:58px;align-items:flex-start}
.tgrid .tog b{font-size:12px}
details{border:1px solid #262626;border-radius:12px;padding:10px 12px;margin:8px 0}
details summary{cursor:pointer;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'▾';color:var(--dim)}
details[open] summary::after{content:'▴'}
details[open] summary{margin-bottom:8px}
.sum{font-size:12px;color:#bbb;background:#141414;border-radius:10px;padding:8px 10px;margin:6px 0}
.mrow details{border:0;padding:0;margin:2px 0 0}
.mrow details summary{font-size:11px;color:var(--dim)}
.abrow{display:flex;gap:6px}
.abrow button{flex:1;padding:7px 2px;font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abrow button.rdy{border-color:var(--acc);color:var(--acc)}
#zbar{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:4}
#zbar button{width:36px;height:36px;padding:0;border-radius:50%;background:rgba(12,12,12,.8);font-size:15px}
#toasts{position:absolute;bottom:8px;left:8px;right:8px;display:flex;flex-direction:column-reverse;align-items:center;gap:5px;pointer-events:none;z-index:3}
.toast{background:rgba(14,14,14,.86);border:1px solid #444;border-radius:10px;padding:7px 12px;font-size:12.5px;max-width:100%;text-align:center;line-height:1.35;transition:opacity .3s,transform .3s}
.toast.acc{border-color:var(--acc);color:var(--acc)}
.toast.tip{border-color:#666;color:#ddd;font-size:12px}
.toast.out{opacity:0;transform:translateY(-6px)}
.armed{border-color:var(--acc)!important;color:var(--acc)!important}
#tcv{flex:1;min-height:0;width:100%;touch-action:none;border:1px solid #1d1d1d;border-radius:10px;background:#080808}
#tinfo{min-height:96px;padding-top:8px;font-size:12px}
#tinfo b{font-size:14px}
.thead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.thead .t{flex:1;font-size:13px}
.thead button{padding:6px 10px;font-size:12px}
@media (min-width:700px){
  #hud{height:54px;flex-basis:54px;font-size:16px}
  #panel{flex-basis:290px;height:290px;padding:12px 16px}
  .card .nm{font-size:14px}.card .ds{font-size:11.5px}.card .cs{font-size:12.5px}
  .cards{grid-auto-columns:190px}
  .g6 button{min-height:62px;font-size:13px}.g6 button i{font-size:11px}.g6 button b{font-size:14px}
  .stats{font-size:13px}.tp-head .t{font-size:15px}
  .gch button{min-height:120px;font-size:12.5px}.gch b{font-size:14px}.gch span{font-size:12px}
  .box{max-width:560px;font-size:15px}.box p{font-size:14.5px}.mrow .i b{font-size:14.5px}.mrow .i span{font-size:12.5px}
  .abrow button{font-size:13px;padding:9px 4px}
}
@media (orientation:landscape) and (min-width:640px){
  #app{display:grid;grid-template-columns:1fr minmax(320px,34%);grid-template-rows:auto 1fr}
  #hud{grid-column:1 / span 2}
  #field{grid-column:1;grid-row:2}
  #panel{grid-column:2;grid-row:2;height:auto;flex:none;border-top:0;border-left:1px solid var(--line);overflow-y:auto}
  .bpanel{height:100%}
  .cards{grid-template-rows:none;grid-auto-flow:row;grid-template-columns:1fr 1fr;grid-auto-rows:68px;overflow-x:hidden;overflow-y:auto}
  .g6{grid-template-columns:repeat(3,1fr)}
  .gch{grid-template-columns:1fr!important}
  .gch button{min-height:0}
}
.pkhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}.pkhead b{font-size:15px}.pkhead .small{flex:1}.pkhead button{padding:6px 10px}
.pkrow{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 12px)/3);gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pkrow::-webkit-scrollbar{display:none}
.pkrow .perk{text-align:left;padding:8px 9px;scroll-snap-align:start;justify-content:flex-start;height:128px;overflow:hidden;gap:4px}
.pkrow .perk b{font-size:12.5px;line-height:1.2}
.pkrow .perk span{font-size:11px;line-height:1.3;flex:1}
.pkrow .perk i{font-size:10px}
.pkhead .more{color:var(--acc);font-size:11px;white-space:nowrap}
@media (min-width:700px){.pkrow .perk{height:170px;padding:10px 12px}.pkrow .perk b{font-size:14px}.pkrow .perk span{font-size:12.5px}}
.evbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;border-color:var(--acc);text-align:left;padding:11px 12px}
.evbtn b{color:var(--acc)}
.mutb{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:9px 11px;font-size:12px}
.mutb.on{border-color:var(--acc)}
.popt{display:flex;gap:6px}.popt button{flex:1;padding:6px 4px;line-height:1.25;font-size:12px;min-width:0}.popt button span{display:block;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idle{display:flex;flex-direction:column;gap:6px;height:100%}
.idle .wrow button{padding:11px 14px}
.chips2{display:flex;gap:6px}.chips2 button{flex:1;min-width:0;padding:6px 8px;font-size:12px;text-align:left;line-height:1.3}.chips2 button span{display:block;font-size:10.5px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips2 .ev{border-color:var(--acc)}.chips2 .ev b{color:var(--acc)}.chips2 .mu.on{border-color:var(--acc);color:var(--acc)}
.info{font-size:11px;line-height:1.4;color:#b0b0b0;min-height:0}
.info .l1{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idle.cmp .info .l1{-webkit-line-clamp:1}
.phold{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--acc);border:1px dashed var(--acc);border-radius:10px;padding:5px 6px 5px 10px;min-height:34px}
.phold span{flex:1}.phold button{padding:5px 12px}
@media (orientation:landscape) and (min-width:640px){.pkhead .more{display:none}.pkrow{display:flex;flex-direction:column;overflow:visible}.pkrow .perk{height:auto}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="s" id="hLives">♥ 20</span>
    <span class="s" id="hGold">● 100</span>
    <span class="s dim" id="hWave">В 0</span>
    <span class="sp"></span>
    <button id="bSpeed">×1</button>
    <button id="bPause">❚❚</button>
  </div>
  <div id="field"><canvas id="cv"></canvas><div id="zbar"></div><div id="toasts"></div></div>
  <div id="panel"></div>
</div>
<div id="ov"><div class="box" id="box"></div></div>
<script>
'use strict';
let COLS=8; const BASE_SP=1.25;
const SIZES=[{n:'Крошечная',c:6},{n:'Малая',c:7},{n:'Средняя',c:8},{n:'Большая',c:10},{n:'Огромная',c:12}];
const sizeIdx=()=>run&&run.size!=null?run.size-2:0;
const FG='#e8e8e8', DIM='#6b6b6b', BG='#0a0a0a'; let ACC='#ff5a36', ACCRGB='255,90,54';
const accA=a=>`rgba(${ACCRGB},${a})`;
const ACCENTS={orange:['Оранжевый','#ff5a36'],cyan:['Бирюзовый','#36d6ff'],gold:['Золотой','#ffc83d'],violet:['Фиолетовый','#a36bff'],lime:['Лаймовый','#a6ff4d'],pink:['Розовый','#ff5ab4'],white:['Белый','#ffffff'],ice:['Ледяной','#9fe6ff'],blood:['Кровавый','#e0102b']};
const GRIDS={dots:'Точки',lines:'Линии',none:'Без сетки'};
function setAccent(k){const c=(ACCENTS[k]||ACCENTS.orange)[1];ACC=c;ACCRGB=[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)).join(',');document.documentElement.style.setProperty('--acc',c)}
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
let DPR=1, CS=40, OX=0, OY=0, VW=0, VH=0, TIME=0;

const NS=window.AndroidStore||null;
var noSave=false;
function readInset(){try{if(NS&&NS.insetTop){const v=+NS.insetTop();if(v>0)document.documentElement.style.setProperty('--sat',v+'px')}}catch(e){}}
readInset();
const store={
  get(k,d){try{const v=NS?NS.get(k):localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{NS?NS.set(k,JSON.stringify(v)):localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{NS?NS.del(k):localStorage.removeItem(k)}catch(e){}}
};
function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<1000)return n<10&&n%1?n.toFixed(1):''+Math.floor(n);
  const s=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
  let i=-1,x=n;while(x>=1000&&i<s.length-1){x/=1000;i++}
  if(x>=1000)return n.toExponential(2).replace('+','');
  return (x<10?x.toFixed(2):x<100?x.toFixed(1):x.toFixed(0))+s[i];
}
const pc=v=>Math.round(v*1000)/10+'%';
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RNG=Math.random; const rnd=()=>RNG();
const d2=(ax,ay,bx,by)=>(ax-bx)*(ax-bx)+(ay-by)*(ay-by);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const wpick=(arr,R)=>{let s=0;for(const a of arr)s+=a.w;let r=(R||rnd)()*s;for(const a of arr){r-=a.w;if(r<=0)return a}return arr[arr.length-1]};
function pfx(s){const o={};if(!s)return o;s.split(',').forEach(p=>{const [k,v]=p.split(':');o[k.trim()]=+v});return o}

/* ================= СТИХИИ ================= */
const EL={phys:'Физика',fire:'Огонь',cold:'Холод',poison:'Яд',shock:'Молния',void:'Пустота'};
const ELS=['phys','fire','cold','poison','shock','void'];
const RX={
 'cold+fire':{n:'Термошок',d:'Огонь по замёрзшему (или наоборот): мгновенный взрыв на 150% урона удара',c:'Ставь Мороз или Вихрь рядом с Огнемётом, Метеором, Ракетами'},
 'fire+poison':{n:'Детонация',d:'Огонь по отравленному: яд взрывается и бьёт всех рядом',c:'Яд или Чума + любой огонь. Чем больше яда, тем сильнее взрыв'},
 'cold+shock':{n:'Оцепенение',d:'Молния по замёрзшему: оглушение на 1.2 с',c:'Тесла/Призма/Дроны за Морозом — враги стоят на месте'},
 'poison+shock':{n:'Коррозия',d:'Молния по отравленному: снимает броню и сопротивления на 5 с',c:'Отлично против бронированных и боссов'},
 'fire+shock':{n:'Перегрузка',d:'Молния по горящему: электрический взрыв вокруг цели',c:'Огнемёт + Тесла — сильная пара против толпы'},
 'cold+poison':{n:'Ледяной яд',d:'Яд по замёрзшему: хрупкость, +35% урона на 4 с',c:'Мороз + Яд усиливает все остальные башни'},
 'void+X':{n:'Разлом',d:'Пустота по любой стихии: метка +30% урона и отброс назад',c:'Гравитация, Проклятие, Бездна вместе с любой стихийной башней'},
};
const rxKey=(a,b)=>a==='void'||b==='void'?'void+X':[a,b].sort().join('+');

/* ================= ЭФФЕКТЫ ================= */
const INT={acRk:1,betTol:1,bellN:1,bhp:1,bellT:1,targets:1,chain:1,bounce:1,pierce:1,beams:1,pellets:1,missiles:1,blades:1,mineCap:1,split:1,chainOnKill:1,lifeOnBoss:1};
const FLAG={prPen:1,rlTwo:1,betMax:1,rodHit:1,ap:1,epi:1,nodecay:1,dotOnly:1,el_fire:1,el_cold:1,el_poison:1,el_shock:1,el_void:1};
const FXN={
 dmg:['Урон',v=>(v>=0?'+':'')+pc(v)+' урона'], rate:['Темп',v=>(v>=0?'+':'')+pc(v)+' скорости'], range:['Радиус',v=>'+'+pc(v)+' радиуса'],
 crit:['Крит',v=>'+'+pc(v)+' шанс крита'], critm:['Сила крита',v=>'+'+pc(v)+' урона крита'],
 targets:['Цели',v=>'+'+v+' цел'+(v>1?'и':'ь')+'/снаряд'], chain:['Цепь',v=>'+'+v+' прыжк'+(v>1?'а':'')+' молнии'], bounce:['Рикошет',v=>'+'+v+' рикошет'+(v>1?'а':'')],
 pierce:['Пробой',v=>'пробивает +'+v], beams:['Лучи',v=>'+'+v+' луч'], pellets:['Дробь',v=>'+'+v+' дробин'+(v>1?'ы':'а')], missiles:['Ракеты',v=>'+'+v+' ракет'+(v>1?'ы':'а')],

const TREE=(function(){
  const nodes=[{id:0,x:0,y:0,t:'start',n:'Начало',fx:{}}], adj=[[]], edges=[];
  const add=(x,y,t,n,fx,ks)=>{nodes.push({id:nodes.length,x,y,t,n,fx,ks});adj.push([]);return nodes.length-1};
  const link=(a,b)=>{edges.push([a,b]);adj[a].push(b);adj[b].push(a)};
  const tips=[];
  SECT.forEach((S,si)=>{
    const th=si*Math.PI/3-Math.PI/2; let prev=0, sm=0; const main=[];
    const small=()=>{const [k,v]=S.small[sm++%S.small.length];return {[k]:v}};
    for(let r=1;r<=10;r++){
      const a=th+(r>1?Math.sin(r*1.3+si)*.06:0), x=Math.cos(a)*r, y=Math.sin(a)*r; let id;
      if(r===4)id=add(x,y,'notable',S.nt[0][0],pfx(S.nt[0][1]));
      else if(r===7)id=add(x,y,'notable',S.nt[1][0],pfx(S.nt[1][1]));
      else if(r===10)id=add(x,y,'key',KEYS[S.keys[0]].n,{},S.keys[0]);
      else id=add(x,y,'small',S.n,small());
      link(prev,id); prev=id; main.push(id);
    }
    [-1,1].forEach((sd,j)=>{
      let p=main[2];
      for(let k=1;k<=5;k++){
        const a=th+sd*(.15+k*.045), r=3+k*.95, x=Math.cos(a)*r, y=Math.sin(a)*r;
        const id=k===5?add(x,y,'notable',S.nt[2+j][0],pfx(S.nt[2+j][1])):add(x,y,'small',S.n,small());
        link(p,id); p=id;
      }
      tips[si*2+j]=p;
      if(j===1){const a=th+sd*.42, x=Math.cos(a)*9.3, y=Math.sin(a)*9.3; const id=add(x,y,'key',KEYS[S.keys[1]].n,{},S.keys[1]); link(p,id)}
    });
  });
  for(let si=0;si<6;si++){
    const a=tips[si*2+1], b=tips[((si+1)%6)*2], A=nodes[a], B=nodes[b], S1=SECT[si], S2=SECT[(si+1)%6];
    let p=a;
    for(let k=1;k<=2;k++){
      const f=k/3, x=A.x+(B.x-A.x)*f, y=A.y+(B.y-A.y)*f, S=k===1?S1:S2, [kk,v]=S.small[0];
      const id=add(x*1.04,y*1.04,'small',S.n,{[kk]:v}); link(p,id); p=id;
    }
    link(p,b);
  }
  const AS=[
   [['notable','Метеор',{ab_meteor:1}],['small','Способности',{meteorPow:.25}],['notable','Огненный дождь',{meteorPow:.5,meteorCd:.2}]],
   [['notable','Стазис',{ab_stasis:1}],['small','Способности',{stasisDur:.5}],['notable','Вечный миг',{stasisDur:1,stasisCd:.2}]],
   [['notable','Лихорадка',{ab_gold:1}],['small','Способности',{goldDur:3}],['notable','Золотой век',{goldMul:1,goldDur:3}]],
   [['notable','Ремонт',{ab_repair:1}],['small','Способности',{repairLives:1}],['notable','Бастион веры',{repairLives:2,repairCd:.25}]],
   [['small','Способности',{abCd:.06}],['small','Способности',{abCd:.06}],['notable','Мастер ритуалов',{abCd:.12}]],
   [['small','Способности',{abPow:.1}],['small','Способности',{abPow:.1}],['notable','Архимаг',{abPow:.3}]],
  ];
  AS.forEach((sp,i)=>{const a=i*Math.PI/3-Math.PI/2+Math.PI/6;let p=0;sp.forEach(([t,n,fx],j)=>{const r=1.45+j*.7;const id=add(Math.cos(a)*r,Math.sin(a)*r,t,n,fx);link(p,id);p=id})});
  return {nodes,adj,edges};
})();

  return m||{shards:0,best:0,lv:{},unl:{}};

(function migrate(){
  const startV=meta.v;
  if(!(meta.v>=2)){
    const OLDC={gold:l=>Math.ceil(3*Math.pow(1.45,l)),lives:l=>Math.ceil(4*Math.pow(1.5,l)),dmg:l=>Math.ceil(5*Math.pow(1.45,l)),rate:l=>Math.ceil(6*Math.pow(1.5,l)),loot:l=>Math.ceil(5*Math.pow(1.45,l)),interest:l=>Math.ceil(8*Math.pow(1.6,l)),reroll:l=>Math.ceil(10*Math.pow(2,l))};
    let refund=0; for(const k in (meta.lv||{}))for(let l=0;l<meta.lv[k];l++)refund+=OLDC[k]?OLDC[k](l):0;
    let xp=0; for(let w=1;w<=(meta.best||0);w++)xp+=1+w/10;
    meta={v:2,shards:(meta.shards||0)+refund,best:meta.best||0,unl:meta.unl||{},xp,tal:[0]};
  }
  if(meta.v===2){
    Object.assign(meta,{v:3,inv:[],orbs:{chaos:2,aug:2,div:1},mast:{},seen:{e:{},b:{},a:{},r:{},t:{}},chDone:{},nid:1});
    if(meta.best>=10)meta.inv.push(genRelic(Math.min(30,meta.best),2));
  }
  if(meta.v===3){
    meta.v=4; meta.chLv={}; for(const k in (meta.chDone||{}))meta.chLv[k]=1; meta.seenU={}; meta.tierMax=0; meta.tierBest={};
    for(const r of meta.inv)if(r.u)meta.seenU[r.u]=1;
  }
  if(!meta.tips)meta.tips={};
  if(!(startV>=4))meta.gift52=1;
  if(startV>=4&&!meta.gift52){meta.gift52=1;meta.ess=(meta.ess||0)+19;meta.pendingGift=Math.max(10,meta.best||0)}
  if(!meta.set)meta.set={vib:2,tips:1,rng:1,atm:1};
  if(meta.set.vib===1&&!meta.set.v2){meta.set.vib=2;meta.set.v2=1} if(meta.set.atm==null)meta.set.atm=1;
  if(meta.v===4){
    meta.v=5; Object.assign(meta,{fus:{},ach:{},cos:{acc:'orange',grid:'dots'},prest:{n:0,stars:0,up:{}},daily:{},stats:{kills:0,rares:0,events:0,abil:0,set4:0},seenSet:{}});
    Object.assign(meta.seen,{rm:{},ev:{},cb:{},bi:{},ab:{}});
  }
  if(!(meta.v>=6)){
    const o=meta.orbs||{}; meta.ess=(meta.ess||0)+(o.chaos||0)+(o.aug||0)+3*(o.div||0); meta.orbs={chaos:0,aug:0,div:0};
    if(!meta.stats)meta.stats={}; if(meta.stats.runs==null)meta.stats.runs=(meta.best||0)>0?Math.max(5,meta.stats.runs||0):0;
    meta.msDone=meta.msDone||{}; meta.featSeen=meta.featSeen||{}; meta.v=6;
    if((meta.best||0)>0){for(const f of FEATS)meta.featSeen[f.k]=1;meta.pendingMs=MS.filter(m=>meta.best>=m.w).map(m=>m.w)}
  }
  if(meta.ess==null)meta.ess=0; if(!meta.msDone)meta.msDone={}; if(!meta.featSeen)meta.featSeen={}; if(!meta.stats.st)meta.stats.st={};
  saveMeta();
})();

function rollAff(a,il){return a.i?a.b:+(a.b*(1+il/40)*(.7+.6*rnd())).toFixed(3)}
function genAffs(il,n,cur){
  const out=cur?Object.assign({},cur):{};
  const hasEl=()=>Object.keys(out).some(k=>k.startsWith('el_'));
  let guard=0;
  while(Object.keys(out).length<n&&guard++<200){
    const a=wpick(AFX.filter(x=>!(x.k in out)&&(!x.m||il>=x.m)&&!(x.k.startsWith('el_')&&hasEl())));
    out[a.k]=rollAff(a,il);
  }
  return out;
}

function snakeIn(c0,c1,r0,r1,startC){
  const w=c1-c0+1, cells=[]; let c=startC!=null?startC:c0+Math.floor(rnd()*w), r=r0; cells.push([c,r]);
  while(r<r1){
    let tc,g=0; do{tc=c0+Math.floor(rnd()*w)}while(Math.abs(tc-c)<2&&g++<30);
    if(Math.abs(tc-c)<2||(r>r0&&rnd()<.15))tc=c;
    while(c!==tc){c+=Math.sign(tc-c);cells.push([c,r])}
    const dd=Math.min(r1-r,rnd()<.35?3:2);
    for(let i=0;i<dd;i++){r++;cells.push([c,r])}
  }
  return cells;
}
function genPathShape(shape){
  const rows=run.rows;
  if(shape==='twin'){const h=Math.floor(COLS/2);return {shape,paths:[snakeIn(0,h-1,0,rows-1),snakeIn(h,COLS-1,0,rows-1)],jump:-1}}
  if(shape==='portal'){
    const mid=Math.floor(rows/2)-1, a=snakeIn(0,COLS-1,0,mid), end=a[a.length-1];
    let sc; do{sc=Math.floor(rnd()*COLS)}while(Math.abs(sc-end[0])<3);
    return {shape,paths:[a.concat(snakeIn(0,COLS-1,mid+2,rows-1,sc))],jump:a.length};
  }
  return {shape:'snake',paths:[snakeIn(0,COLS-1,0,rows-1)],jump:-1};
}
function genPath(shape){
  let best=null,bestScore=1e9;
  for(let a=0;a<90;a++){
    const g=genPathShape(shape), all=[].concat(...g.paths);
    const col=run.towers.filter(t=>all.some(([x,y])=>x===t.gx&&y===t.gy)).length;
    const score=col*1000+Math.abs(g.paths[0].length-run.rows*(g.shape==='twin'?1.8:2.6)*COLS/8)+all.filter(([x,y])=>run.ter[x+','+y]==='rock').length*2;
    if(score<bestScore){best=g;bestScore=score}
  }
  return best;
}

function mkTrack(cells,jump){
  const pts=[[cells[0][0]+.5,-.7]], jmp=new Set();
  cells.forEach(([x,y],i)=>{if(i===jump)jmp.add(pts.length);pts.push([x+.5,y+.5])});
  pts.push([cells[cells.length-1][0]+.5,run.rows+.7]);
  const cum=[0];
  for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+(jmp.has(i)?0:Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1])));
  const A=pts[0],B=pts[pts.length-1];
  return {pts,cum,len:cum[cum.length-1],jmp,fly:{ax:A[0],ay:A[1],bx:B[0],by:B[1],len:Math.hypot(B[0]-A[0],B[1]-A[1])}};
}
function buildPath(){

  for(const [x,y] of all)delete run.ter[x+','+y];
  const bio=BIOMES[run.biome]||BIOMES.plain;
  if(!run.swamp)run.swamp=all.filter(()=>rnd()<(bio.swamp||.15)).map(([x,y])=>x+','+y);
  const tracks=g.paths.map((c,i)=>mkTrack(c,i===0?g.jump:-1));
  P={tracks,set:new Set(all.map(([x,y])=>x+','+y)),samples:[],swamp:new Set(run.swamp)};
  for(const tr of tracks)for(let d=1;d<tr.len-1;d+=.25)P.samples.push(posAt(d,tr));
  for(const k in run.ter)if(!seen.t[run.ter[k]])seen.t[run.ter[k]]=1;
  if(run.swamp.length)seen.t.swamp=1;
  seen.t['shape_'+g.shape]=1; seen.bi[run.biome]=1;
}
function posAt(d,tr){
  tr=tr||P.tracks[0]; const c=tr.cum;
  if(d<=0)return tr.pts[0].slice(); if(d>=tr.len)return tr.pts[tr.pts.length-1].slice();
  let lo=0,hi=c.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(c[m]<=d)lo=m;else hi=m}
  const sp=c[hi]-c[lo]; if(sp<=0)return tr.pts[hi].slice();
  const f=(d-c[lo])/sp, a=tr.pts[lo], b=tr.pts[hi];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f];
}

function resOf(e,el){
  if(el==='none')return 0;
  if(e.bks&&e.bks.includes('prism'))return e.vuln===el?0:.9;
  return el==='phys'?e.ar:(e.res[el]||0);
}
function hurt(e,amt,o){
  if(e.dead||!(amt>0))return;
  o=o||{};
  if(e.inv>0)return;
  let m=amt;
  const cc=o.noCrit?0:G.crit+(o.crit||0);
  if(cc>0&&rnd()<cc)m*=G.critm+(o.critm||0);
  if(e.mark>0)m*=1.3; if(e.brittle>0)m*=1.35; if(e.acid>0)m*=1.2;
  const el=o.el||'none';
  if(el!=='none'){
    let r=resOf(e,el);
    if(e.acid>0)r=el==='phys'?0:r-.25;
    else if(o.pierce)r=el==='phys'?0:r*.5;
    m*=1-Math.max(-.6,Math.min(.95,r));
  }
  if(e.sh>0&&!o.dot){
    const k=el==='shock'?2:el==='poison'?.5:1; let mm=m*k; const take=Math.min(e.sh,mm); e.sh-=take; e.shT=2.5; mm-=take; m=mm/k; if(m<=0)return;
  }
  const dealt=Math.min(m,Math.max(0,e.hp)); if(o.src){o.src.dw=(o.src.dw||0)+dealt;o.src.dt=(o.src.dt||0)+dealt;const ek=o.src.pEl||o.src.el||'phys';run.elD[ek]=(run.elD[ek]||0)+dealt}
  e.hp-=m;
  if(e.hp<=0||(G.exec>0&&!e.noExec&&e.hp<e.maxHp*G.exec*(e.boss?.3:1)))kill(e);
}
function addDot(e,v,refresh,el){if(!(v>0)||e.dead)return;v*=1-Math.max(-.6,Math.min(.95,el&&el!=='phys'?resOf(e,el):0));if(refresh)e.pDps=Math.max(e.pDps,v);else e.pDps+=v}

function pick(t,list,n){

/* ================= HUD / ПАНЕЛЬ ================= */
let hudCache='', panelCache='';
function hud(){
  if(!run)return;
  const s=`${run.lives}|${fmt(run.gold)}|${run.wave}|${run.enemies.length}|${run.speed}|${run.inWave}`;
  if(s===hudCache)return; hudCache=s;
  $('#hLives').textContent='♥ '+run.lives;
  $('#hGold').textContent='● '+fmt(run.gold);
  $('#hWave').textContent='Волна '+run.wave+(run.inWave?' · '+(run.enemies.length+run.spQ.length):'');
  $('#bSpeed').textContent='×'+run.speed;
}
function statLine(t){
  const s=t.st, f=s.f, R=' · R '+s.range.toFixed(1), el=t.el?' · '+EL[t.el]:'';
  switch(t.def.k){
    case 'bank': return `Доход ${fmt(bankIncome(t))} ●/волна`+(f.interestB?' · +'+pc(f.interestB)+' проц.':'');
    case 'beacon':{const b=beaconBuff(t);return `Соседям: +${pc(b.d)} урона, +${pc(b.s)} скор.`+(b.r?', +'+pc(b.r)+' радиуса':'')}
    case 'chroma': return `Соседи бьют: ${EL[t.pel||'fire']}`+(f.prPen?'':` · им −${pc(Math.max(0,.15-.01*(t.lv-1)))} урона`)+R;
    case 'relay': return t.rlSrc?`Копирует: ${t.rlSrc} · ${pc(rlShare(t))}`+R:'Нет соседа с веткой'+R;
    case 'metro': return `Залп раз в ${(t.per||2.4).toFixed(1)} с · в залпе ${t.mtN||0} · +${pc((t.mul||.06)*(t.mtN||0))}`+R;
    case 'tote': return `Ставка ${Math.round((run.betPct||0)*100)}% золота · выигрыш ×${(Math.min(2.2,1.6+.01*(t.lv-1))+(f.betM||0)).toFixed(2)}`;
    case 'shop': return `Соседям −${pc(Math.min(.35,.12+.004*(t.lv-1)+(f.wsD||0)))} к цене улучшений`+R;
    case 'acad': return `Соседям ×${(1.5+.02*(t.lv-1)+(f.acX||0)).toFixed(2)} опыта`+(f.acRk?' · +'+f.acRk+'★':'')+R;
    case 'rod': return `${fmt(s.dmg)} · ${s.rate.toFixed(2)}/с · защита от помех`+R;
    case 'barr': return `Прочность ${Math.ceil(t.bhp==null?t.bMax||0:t.bhp)}/${t.bMax||0}`+(f.bthorn?' · шипы':'');
    case 'bell': return `Замедление ${pc(Math.min(.85,.6+(f.bellV||0)))} на ${(Math.min(4,2+.05*(t.lv-1))+(f.bellT||0)).toFixed(1)} с · ${1+(f.bellN||0)} раз за волну`;
    case 'pylon': return `Сеть из ${t.pyN||1} · соседям +${pc(.04*Math.min(8,t.pyN||1)*(1+.05*(t.lv-1))*(1+(f.pyB||0)))} урона`+R;
    case 'aura': return `${fmt(s.dmg)}/с`+(f.slow?` · замедл. ${pc(Math.min(.85,(f.slow+G.slowAdd)*G.slowMul))}`:'')+R+el;
    case 'beam': return `${fmt(s.dmg)}/с (до ×${1+(f.ramp||0)})`+R+el;
    case 'cone': return `${fmt(s.dmg*s.rate)}/с`+R+el;
    case 'orbit': return `${fmt(s.dmg)} · пил ${Math.floor(f.blades||1)}`+R+el;
    default: return `${fmt(s.dmg)}${f.dotOnly?'/с ядом':''} · ${s.rate.toFixed(2)}/с`+R+el;
  }
}
function choiceHtml(t){
  tip('branch','Выбор специализации — навсегда для этой башни. Описание под названием.');
  ensureOffer(t);
  const o=t.offer, n=o.list.length, bl=branches(t);
  const items=o.kind==='br'?o.list.map(i=>{const b=bl[i];return `<button data-a="choose" data-i="${i}" ${i===5?'class="acc"':''}><b>${b.n}</b><span>${fxDesc(b.fx)}</span></button>`})
    :o.list.map((x,i)=>`<button data-a="choose" data-i="${i}" ${x.rare?'class="acc"':''}><b>${x.rare?'★ ':''}${x.n}</b><span>${fxDesc(x.fx)}</span></button>`);
  const und=t.undoUntil>performance.now()&&t.lv===(t.lv0||1)?`<button data-a="undo" class="acc" style="float:right;padding:2px 10px;font-size:11px">↶ отменить ${Math.ceil((t.undoUntil-performance.now())/1000)} · +${fmt(t.inv)}</button>`:'';
  return `<div class="stats" style="color:var(--acc)">${und}${o.kind==='br'?'Выбери специализацию':'Улучшение ветки · ур.'+(15+10*t.subs.length)}</div><div class="gch" style="grid-template-columns:repeat(${n},1fr)">${items.join('')}</div>`;
}
function chBlocks(k){
  const c=run.ch; if(!c)return null;
  const types=new Set(run.towers.map(t=>t.type));
  if(c==='trio'&&!types.has(k)&&types.size>=3)return 'Испытание: максимум 3 типа';
  if(c==='minimal'&&run.towers.length>=6)return 'Испытание: максимум 6 башен';
  if(c==='elemental'&&T[k].el==='phys')return 'Испытание: только стихии';
  return null;
}

  return `<div class="pkhead"><b>Выбери перк</b><span class="small dim">${run.perkOffer.length} на выбор${run.perkQ?' · ещё '+run.perkQ:' · до конца забега'}</span>${run.perkQ>0?`<button data-a="pauto">авто ×${run.perkQ+1}</button>`:''}${run.perkOffer.length>3?'<span class="more">листай →</span>':''}${run.rerolls>0?`<button data-a="preroll">⟳ ${run.rerolls}</button>`:''}</div><div class="pkrow">`+
    run.perkOffer.map(k=>{const p=perkDef(k);if(!p)return '';const n=run.perks[k]||0;return `<button class="perk" data-a="perk" data-k="${k}"><b>${p.n}</b><span>${p.d}</span><i>${n?'уже ×'+n:'новый'}</i></button>`}).join('')+'</div>';
}
function renderPerks(){if(!modalOpen)return;
  showModal(`<h2>Выбери перк</h2><p class="small dim">Действует до конца забега. Одинаковые перки складываются.</p><div class="col">`+
    perkOffer.map(k=>{const p=perkDef(k),n=run.perks[k]||0;return `<button class="perk" data-m="perk" data-k="${k}"><b>${p.n}</b><span>${p.d}</span><i>${n?'уже ×'+n:'новый'}</i></button>`}).join('')+

/* ===== дерево талантов: UI ===== */
let TREEUI=null;
function treeModal(){
  const li=lvlInfo();
  showModal(`<div class="thead"><span class="t">◈ <b id="tpts">${talPoints()}</b> · ур.${li.l} <span class="dim small">(${Math.floor(li.cur)}/${li.need} оп.)</span></span>
    <button data-m="treset" data-confirm="1">Сброс</button><button data-m="${backTo}">Назад</button></div>
    <canvas id="tcv"></canvas><div id="tinfo"></div>`,true);
  const c=$('#tcv');
  TREEUI={c,g:c.getContext('2d'),px:0,py:0,z:.9,sel:null,ptr:new Map(),moved:false};
  const U=TREEUI; const r=c.getBoundingClientRect(); c.width=r.width*DPR; c.height=r.height*DPR; U.w=r.width; U.h=r.height;
  c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);U.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});U.moved=false;U.sx=e.clientX;U.sy=e.clientY;
    if(U.ptr.size===2){const [a,b]=[...U.ptr.values()];U.pd=Math.hypot(a.x-b.x,a.y-b.y);U.pz=U.z;U.moved=true}});
  c.addEventListener('pointermove',e=>{if(!U.ptr.has(e.pointerId))return;const pr=U.ptr.get(e.pointerId);const dx=e.clientX-pr.x,dy=e.clientY-pr.y;pr.x=e.clientX;pr.y=e.clientY;
    if(U.ptr.size===1){if(U.moved||Math.hypot(e.clientX-U.sx,e.clientY-U.sy)>6){U.moved=true;U.px+=dx;U.py+=dy;drawTree()}}
    else if(U.ptr.size===2){const [a,b]=[...U.ptr.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const rc=c.getBoundingClientRect();const mx=(a.x+b.x)/2-rc.left,my=(a.y+b.y)/2-rc.top;
      const nz=Math.max(.35,Math.min(2.5,U.pz*d/U.pd));const k=nz/U.z;U.px=mx-U.w/2-(mx-U.w/2-U.px)*k;U.py=my-U.h/2-(my-U.h/2-U.py)*k;U.z=nz;drawTree()}});
  const up=e=>{if(!U.ptr.has(e.pointerId))return;U.ptr.delete(e.pointerId);
    if(!U.moved&&U.ptr.size===0){const rc=c.getBoundingClientRect();const mx=e.clientX-rc.left,my=e.clientY-rc.top;let best=null,bd=22*22;
      for(const n of TREE.nodes){const [sx,sy]=tp(n);const dd=d2(sx,sy,mx,my);if(dd<bd){bd=dd;best=n.id}}
      U.sel=best;drawTree();treeInfo()}};
  c.addEventListener('pointerup',up); c.addEventListener('pointercancel',up);
  c.addEventListener('wheel',e=>{e.preventDefault();U.z=Math.max(.35,Math.min(2.5,U.z*(e.deltaY<0?1.1:.9)));drawTree()},{passive:false});
  drawTree(); treeInfo();
}
const tp=n=>{const U=TREEUI,S=46*U.z;return [U.w/2+U.px+n.x*S,U.h/2+U.py+n.y*S]};
function talPath(id){
  const s=talSet(); if(s.has(id))return [];
  const prev={}, q=[...s], seenN=new Set(s);
  while(q.length){const c=q.shift();for(const n of TREE.adj[c]){if(seenN.has(n))continue;seenN.add(n);prev[n]=c;if(n===id){const p=[];let x=id;while(!s.has(x)){p.unshift(x);x=prev[x]}return p}q.push(n)}}
  return null;
}
function canAlloc(id){const s=talSet();return !s.has(id)&&TREE.adj[id].some(a=>s.has(a))}
function drawTree(){
  const U=TREEUI; if(!U)return; const g=U.g; g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,U.w,U.h);
  const s=talSet();
  const pth=U.sel!=null&&!canAlloc(U.sel)&&!s.has(U.sel)?(talPath(U.sel)||[]):[]; const ps=new Set(pth);
  for(const [a,b] of TREE.edges){const A=tp(TREE.nodes[a]),B=tp(TREE.nodes[b]);const ia=s.has(a),ib=s.has(b);
    g.strokeStyle=ia&&ib?FG:ia||ib?'#555':'#242424';g.lineWidth=ia&&ib?2:1.2;g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(B[0],B[1]);g.stroke()}
  g.font='10px ui-monospace,monospace'; g.textAlign='center'; g.textBaseline='top';
  for(const n of TREE.nodes){
    const [x,y]=tp(n); if(x<-30||y<-30||x>U.w+30||y>U.h+30)continue;
    const r=(n.t==='key'?11:n.t==='notable'?8:n.t==='start'?9:4.5)*Math.max(.7,Math.min(1.4,U.z));
    const al=s.has(n.id), av=canAlloc(n.id);
    g.beginPath();
    if(n.t==='key'){g.save();g.translate(x,y);poly(g,4,r*1.3,0);g.restore()} else g.arc(x,y,r,0,7);
    g.fillStyle=al?(n.t==='key'?ACC:FG):'#0b0b0b'; g.fill();
    g.strokeStyle=al?(n.t==='key'?ACC:FG):av?ACC:'#444'; g.lineWidth=av?2:1.3; g.stroke();
    if(U.sel===n.id){g.strokeStyle=ACC;g.lineWidth=1.5;g.beginPath();g.arc(x,y,r+5,0,7);g.stroke()}
    else if(ps.has(n.id)){g.strokeStyle=accA(.7);g.lineWidth=1.5;g.setLineDash([2,2]);g.beginPath();g.arc(x,y,r+4,0,7);g.stroke();g.setLineDash([])}
    if((n.t==='notable'||n.t==='key'||n.t==='start')&&U.z>.55){g.fillStyle=al?FG:n.t==='key'?'#aa6655':'#777';g.fillText(n.n,x,y+r+4)}
  }
  if(U.z<=.55){g.fillStyle='#555';g.textAlign='center';SECT.forEach((S,i)=>{const a=i*Math.PI/3-Math.PI/2;const [x,y]=tp({x:Math.cos(a)*11.3,y:Math.sin(a)*11.3});g.font='12px ui-monospace,monospace';g.fillText(S.n,x,y-6)})}
}
function treeInfo(){
  const U=TREEUI; if(!U)return; const el=$('#tinfo'); const n=U.sel!=null?TREE.nodes[U.sel]:null;
  $('#tpts').textContent=talPoints();
  if(!n){el.innerHTML=`<span class="dim">Тяни — двигать, двумя пальцами — масштаб. Тапни узел, чтобы посмотреть. Таланты действуют со следующего забега.</span>`;return}
  const al=talSet().has(n.id), av=canAlloc(n.id), pts=talPoints();
  const d=n.ks?KEYS[n.ks].d:n.t==='start'?'Отсюда растёт всё дерево':tfxDesc(n.fx);
  el.innerHTML=`<b style="${n.t==='key'?'color:var(--acc)':''}">${n.t==='small'?'Узел · '+n.n:n.n}</b> <span class="dim small">${n.t==='key'?'ключевой':n.t==='notable'?'крупный':''}</span>
    <div style="margin:6px 0 8px;color:#bbb">${d}</div>
    ${al?'<span class="dim">Изучено</span>':!av?(()=>{const p=talPath(n.id)||[];return `<button class="${pts>=p.length?'acc':''}" data-m="talpath" ${pts>=p.length?'':'disabled'}>${pts>=p.length?'Изучить путь · '+p.length+' ◈':'Путь: '+p.length+' ◈, есть '+pts}</button>`})():`<button class="${av&&pts>0?'acc':''}" data-m="talloc" ${av&&pts>0?'':'disabled'}>${av?(pts>0?'Изучить · 1 ◈':'Нет очков'):'Нужен соседний изученный узел'}</button>`}`;
}

$('#box').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-m]'); if(!b)return; const m=b.dataset.m;
  if(!armed(b))return;
  if(m==='new')newRun();
  else if(m==='setup'){setup.code=null;setupModal()}
  else if(m==='sw'){setup.startW=+b.dataset.w;setupModal()}
  else if(m==='codeset'){const c=parseCode(($('#codeIn')||{}).value);if(!c){banner('Код не распознан');return}const tm=meta.tierMax||0;if(c.tier>tm)c.tier=tm;
    setup.code=c;setup.size=c.size;setup.biome=c.biome;setup.th=Object.assign({},c.th);setup.tier=c.tier;setup.ch=null;setup.startW=0;banner('Код применён');setupModal()}
  else if(m==='codeclr'){setup.code=null;setupModal()}
  else if(m==='codecp'){const c=run?runCode(run):'';copyText(c);banner('Код скопирован: '+c)}
  else if(m==='stats')statsModal();
  else if(m==='thr'){const k=b.dataset.k;if(setup.th[k])delete setup.th[k];else setup.th[k]=1;setupModal()}
  else if(m==='tier'){setup.tier=Math.max(0,Math.min(meta.tierMax||0,(setup.tier||0)+(+b.dataset.d)));const sc=$('#box').scrollTop;setupModal();$('#box').scrollTop=sc}
  else if(m==='chs'){setup.ch=b.dataset.k||null;setupModal()}
  else if(m==='cont'){if(!loadRun())setupModal()}
  else if(m==='shop')shopModal();
  else if(m==='shf'){shopF=b.dataset.k;shopModal();$('#box').scrollTop=0}
  else if(m==='tree')treeModal();
  else if(m==='relics'){relSel=null;relicsModal()}
  else if(m==='rsel'){relListScroll=$('#box').scrollTop;relSel=+b.dataset.id;relicsModal()}
  else if(m==='rback'){relSel=null;relicsModal();$('#box').scrollTop=relListScroll}
  else if(m==='rf'){relF=b.dataset.k;relSel=null;relicsModal();$('#box').scrollTop=0}
  else if(m==='orb'){const r=relicById(relSel),k=b.dataset.k;if(r&&!r.u&&(meta.ess||0)>=OV[k]){
      if(k==='chaos'){const n=Math.max(1,Object.keys(r.aff).length);r.aff=genAffs(r.il,Math.min(4,Math.max(n,rnd()<.3?n+1:n)))}
      else if(k==='aug'){if(Object.keys(r.aff).length>=4)return;r.aff=genAffs(r.il,Object.keys(r.aff).length+1,r.aff)}
      else if(k==='div'){for(const key in r.aff){const a=AFX.find(x=>x.k===key);if(a)r.aff[key]=rollAff(a,r.il)}}
      meta.ess-=OV[k];saveMeta();if(run)run.towers.forEach(mergeFx);relicsModal()}}
  else if(m==='salv'){const r=relicById(relSel);if(r){if(equippedBy(r.id)){const t=equippedBy(r.id);t.rel=t.rel.filter(i=>i!==r.id);mergeFx(t)}meta.shards+=salvageVal(r);meta.inv=meta.inv.filter(x=>x!==r);relSel=null;saveMeta();relicsModal()}}
  else if(m==='sockin'){const id=+b.dataset.id;if(sockT&&sockT.rel.length<sockCount(sockT)&&!equippedBy(id)){sockT.rel.push(id);recomputeAll();computeBuffs();if(!run.inWave)saveRun()}socketModal(sockT)}
  else if(m==='unsock'){const id=+b.dataset.id;if(sockT){sockT.rel=sockT.rel.filter(i=>i!==id);recomputeAll();computeBuffs();if(!run.inWave)saveRun()}socketModal(sockT)}
  else if(m==='atlas')atlasModal();
  else if(m==='daily')dailyModal();
  else if(m==='tsock'){sockBackInfo=true;socketModal(sel.t)}
  else if(m==='tinfo'){sockBackInfo=false;towerInfo(sel.t)}
  else if(m==='settings')settingsModal();
  else if(m==='export')exportModal();
  else if(m==='import')importModal();
  else if(m==='excopy'){banner(copyText(exportStr())?'Скопировано':'Не удалось скопировать — выдели текст вручную',true)}
  else if(m==='imgo'){try{importStr($('#imta').value);banner('Сохранение загружено',true);setTimeout(()=>location.reload(),600)}catch(e){banner(e.message,true)}}
  else if(m==='set'){const k=b.dataset.k;if(k==='vib')meta.set.vib=((meta.set.vib||0)+1)%3;else meta.set[k]=meta.set[k]?0:1;saveMeta();settingsModal();if(k==='vib')haptic('click')}

  else if(m==='dailygo')newRun({daily:true});
  else if(m==='ach')achModal();
  else if(m==='cosacc'){meta.cos.acc=b.dataset.k;setAccent(b.dataset.k);saveMeta();achModal()}
  else if(m==='cosgrid'){meta.cos.grid=b.dataset.k;saveMeta();achModal()}
  else if(m==='prest')prestModal();
  else if(m==='prestgo'){const g=prestGain();if(g>0){meta.prest.stars+=g;meta.prest.n++;meta.xp=0;meta.tal=[0];checkAch();saveMeta()}prestModal()}
  else if(m==='starbuy'){const x=STAR.find(z=>z.k===b.dataset.k),lv=SU(x.k),c=x.c(lv);if(meta.prest.stars>=c&&!(x.max&&lv>=x.max)){meta.prest.stars-=c;meta.prest.up[x.k]=lv+1;saveMeta()}prestModal()}

  else if(m==='fuse'){const o=run.towers.find(x=>x.id===+b.dataset.id),t=sel&&sel.t;if(o&&t){closeModal();fuse(t,o,b.dataset.r);if(!run.inWave)saveRun()}}
  else if(m==='rup'){const r=relicById(relSel),c=r?upCostR(r):0;if(r&&meta.shards>=c){meta.shards-=c;r.il+=5;for(const k in r.aff)if(!INT[k]&&!FLAG[k])r.aff[k]=+(r.aff[k]*1.1).toFixed(3);saveMeta();if(run)recomputeAll();relicsModal()}}
  else if(m==='evopen'){openEv(+b.dataset.i)}
  else if(m==='evbuy'){const ev=run.pendingEvent,it=ev&&ev.items[+b.dataset.i];if(it&&!it.sold&&run.gold>=it.p){run.gold-=it.p;it.sold=1;
      if(it.t==='relic'){addRelic(it.r);run.loot.push(it.r.id)}else if(it.t==='orb')addEss(typeof it.o==='number'?it.o:2);else run.lives+=5;saveMeta()}eventModal()}
  else if(m==='evpact'){const k=b.dataset.k;run.pacts.push({k,until:run.wave+10});if(k==='storm')run.lives=Math.max(1,run.lives-3);if(k==='gift'){const r=genRelic(lootIl(run.wave),2);addRelic(r);run.loot.push(r.id)}calcG();banner('Пакт: '+PACTS[k].n,true);endEvent()}
  else if(m==='evchest'){run.courier=run.wave+1;endEvent()}
  else if(m==='evcon'){const k=b.dataset.k;run.contract={k,w:run.wave+1,lim:genWave(run.wave+1).q.slice(-1)[0].at+15};endEvent()}
  else if(m==='evwell'){const c=Math.floor(run.gold*.2);run.gold-=c;const r=rnd();let msg;
      if(r<.4){run.gold+=c*2;msg='Колодец вернул вдвое: +'+fmt(c*2)+' ●'}else if(r<.7){run.lives+=4;msg='+4 жизни'}else if(r<.9){const x=genRelic(lootIl(run.wave),2);addRelic(x);run.loot.push(x.id);msg='Реликвия: '+x.n}else msg='Колодец промолчал';
      banner(msg,true);endEvent()}
  else if(m==='evwand'){if(b.dataset.k==='lv'){const ts=run.towers.filter(t=>!needChoice(t));const t=ts[(rnd()*ts.length)|0];if(t){t.lv+=5;recomputeAll();computeBuffs();banner(t.def.n+' +5 ур.',true)}}else{run.pendingPerk=true;rollPerks();sel=null;endEvent();return}endEvent()}
  else if(m==='evleave')endEvent();
  else if(m==='atab'){atlasTab=b.dataset.k;atlasModal();$('#box').scrollTop=0}
  else if(m==='help')helpModal();
  else if(m==='pause'){if(run&&run.over)overModal();else pauseModal()}

  else if(m==='tomenu'){if(!run.inWave)saveRun();saveMeta();run=null;P=null;sel=null;menu()}

let last=performance.now();
function frame(now){
  let dt=Math.min(.1,(now-last)/1000); last=now; TIME+=dt;
  if(run&&!modalOpen&&!run.over){if(run.bossFx>0)run.bossFx-=dt;let sim=dt*run.speed;if(run.slowT>0){run.slowT-=dt;sim*=.3}while(sim>1e-6){const h=Math.min(sim,1/60);step(h);sim-=h;if(!run||run.over)break}}
  draw(); hud(); renderPanel(); renderZbar();
  requestAnimationFrame(frame);
}
